name: Java CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permet de déclencher manuellement

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run: mvn test -Dexcludes="**/endtoend/**"

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --target runtime -t ${{ secrets.DOCKERHUB_USERNAME }}/product-micro-service:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/product-micro-service:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-micro-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-micro-service:latest

      # Étape de debug pour vérifier l'installation de Railway CLI
      - name: Install Railway CLI and verify
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          railway --version
          railway whoami
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Déploiement avec l'action officielle (recommandé)
      - name: Deploy to Railway
        uses: railwayapp/actions/deploy@v3
        with:
          service: product-micro-service
          projectId: ${{ secrets.RAILWAY_PROJECT_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}